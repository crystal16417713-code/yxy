<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background: #000; color: #6667AB; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
        #num { font-size: 120px; font-weight: bold; color: #fff; text-shadow: 0 0 30px #6667AB; margin: 0; }
        .label { color: #2a2a35; font-size: 10px; letter-spacing: 5px; margin-bottom: 20px; }
        .btn { margin-top: 50px; padding: 12px 40px; border: 1px solid #6667AB; color: #6667AB; background: none; cursor: pointer; letter-spacing: 4px; }
    </style>
</head>
<body>
    <div class="label">FINGERPRINT BINDING</div>
    <div id="num">--</div>
    <button class="btn" onclick="copyNum()">提取并解锁</button>

    <script>
        (function() {
            const today = new Date().toLocaleDateString('zh-CN');
            const storageKey = 'id_lock_v15_fp';
            
            // 维度1：静默采集硬件指纹 (无需用户操作)
            const fingerprint = [
                navigator.hardwareConcurrency, // CPU核心
                screen.width + 'x' + screen.height, // 分辨率
                navigator.language, // 语言
                screen.colorDepth, // 色深
                navigator.userAgent.length // 字符长度特征
            ].join('|');

            let data = JSON.parse(localStorage.getItem(storageKey) || '{}');

            // 逻辑执行：日期变动或初次扫码，则触发哈希计算并存入死锁
            if (data.date !== today) {
                const seed = today + fingerprint;
                let hash = 0;
                for (let i = 0; i < seed.length; i++) {
                    hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                    hash |= 0;
                }
                // 映射至 1-64 闭环区间
                const finalNum = Math.abs(hash % 64) + 1;
                data = { date: today, num: finalNum };
                localStorage.setItem(storageKey, JSON.stringify(data));
            }

            document.getElementById('num').innerText = data.num;
        })();

        function copyNum() {
            const n = document.getElementById('num').innerText;
            navigator.clipboard.writeText(n).then(() => {
                alert("标记“" + n + "”已提取\n\n请返回对话框粘贴发送。");
            });
        }
    </script>
</body>
</html>
